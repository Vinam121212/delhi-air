name: Morning AQI digest

on:
  schedule:
    - cron: "30 1 * * *"     # 01:30 UTC = 7:00 AM IST, every day
  workflow_dispatch:         # "Run workflow" button for testing

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python digest.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WAQI_TOKEN: ${{ secrets.WAQI_TOKEN }}
          DIGEST_LOCATIONS: ${{ vars.DIGEST_LOCATIONS }}
